<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Deivam Store QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      background: #f5f3ef;
      color: #29251f;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    header {
      background: #633b20;
      color: white;
      text-align: center;
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 18px;
    }

    .panel {
      background: white;
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px #00000012;
    }

    select, button {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border-radius: 8px;
      font-size: 16px;
    }

    select {
      border: 1px solid #ccc;
      background: white;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
    }

    .primary {
      background: #633b20;
      color: white;
    }

    .secondary {
      background: #eee5da;
      color: #352719;
    }

    #reader {
      width: 100%;
      overflow: hidden;
    }

    #message {
      line-height: 1.5;
      font-size: 14px;
    }

    .error {
      color: #b00020;
    }

    .success {
      color: #16834a;
    }
  </style>
</head>

<body>

<div class="container">

  <header>
    <h2>DEIVAM STORE</h2>
    <div>Order QR Scanner</div>
  </header>

  <div class="panel">

    <h3>Camera Selection</h3>

    <select id="cameraSelect">
      <option value="">Detecting cameras...</option>
    </select>

    <button
      id="startButton"
      class="primary"
      onclick="startScanner()"
      disabled
    >
      Start Scanner
    </button>

    <button
      id="stopButton"
      class="secondary"
      onclick="stopScanner()"
      disabled
    >
      Stop Scanner
    </button>

  </div>

  <div class="panel">
    <div id="reader"></div>
  </div>

  <div class="panel">
    <div id="message">
      Initializing camera...
    </div>
  </div>

</div>

<script>

  let scanner = null;
  let scannerRunning = false;
  let scanProcessed = false;

  const TOKEN_REGEX =
    /^[0-9a-f-]{36}-[0-9a-f-]{36}$/i;


  function showMessage(text, type = "") {
    const element = document.getElementById("message");

    element.textContent = text;
    element.className = type;
  }


  // Validate the Cashier Dashboard return URL.
  function getCashierReturnUrl() {
    const params = new URLSearchParams(window.location.search);

    const returnValue = params.get("return");

    if (!returnValue) {
      throw new Error(
        "Cashier Dashboard return URL not found."
      );
    }

    const cashierUrl = new URL(returnValue);

    const allowedHosts = [
      "script.google.com",
      "script.googleusercontent.com"
    ];

    if (
      cashierUrl.protocol !== "https:" ||
      !allowedHosts.includes(cashierUrl.hostname)
    ) {
      throw new Error(
        "Invalid Cashier Dashboard URL."
      );
    }

    return cashierUrl;
  }


  // Detect available cameras.
  async function loadCameras() {
    const select = document.getElementById("cameraSelect");
    const startButton = document.getElementById("startButton");

    try {
      const cameras = await Html5Qrcode.getCameras();

      select.innerHTML = "";

      if (!cameras || cameras.length === 0) {
        throw new Error("No camera detected.");
      }

      cameras.forEach((camera, index) => {
        const option = document.createElement("option");

        option.value = camera.id;
        option.textContent =
          camera.label || ("Camera " + (index + 1));

        select.appendChild(option);
      });

      const rearCamera = cameras.find(camera =>
        /back|rear|environment|world/i.test(camera.label)
      );

      if (rearCamera) {
        select.value = rearCamera.id;
      }

      startButton.disabled = false;

      showMessage(
        "Camera ready. Press Start Scanner.",
        "success"
      );

    } catch (error) {
      showMessage(
        "Camera access error: " + error.message,
        "error"
      );

      select.innerHTML =
        '<option value="">No camera available</option>';
    }
  }


  // Start selected camera.
  async function startScanner() {
    if (scannerRunning) return;

    const cameraId =
      document.getElementById("cameraSelect").value;

    if (!cameraId) {
      return showMessage(
        "Please select a camera.",
        "error"
      );
    }

    scanProcessed = false;

    scanner = new Html5Qrcode("reader");

    const config = {
      fps: 10,
      qrbox: {
        width: 240,
        height: 240
      }
    };

    try {
      await scanner.start(
        cameraId,
        config,
        onScanSuccess,
        () => {}
      );

      scannerRunning = true;

      document.getElementById("startButton").disabled = true;
      document.getElementById("stopButton").disabled = false;
      document.getElementById("cameraSelect").disabled = true;

      showMessage(
        "Scanner started. Point the camera at the customer order QR.",
        "success"
      );

    } catch (error) {
      scanner = null;

      showMessage(
        "Unable to start camera: " + error.message,
        "error"
      );
    }
  }


  // Stop scanner safely.
  async function stopScanner() {
    if (!scanner || !scannerRunning) return;

    try {
      await scanner.stop();
      await scanner.clear();
    } catch (error) {
      // Ignore cleanup errors.
    }

    scannerRunning = false;

    document.getElementById("startButton").disabled = false;
    document.getElementById("stopButton").disabled = true;
    document.getElementById("cameraSelect").disabled = false;
  }


  // QR scan success.
  async function onScanSuccess(decodedText) {
    if (scanProcessed) return;

    scanProcessed = true;

    const token = String(decodedText || "").trim();

    if (!TOKEN_REGEX.test(token)) {
      scanProcessed = false;

      showMessage(
        "Invalid Deivam Store order QR token. Please scan again.",
        "error"
      );

      return;
    }

    showMessage(
      "QR scanned successfully. Returning to Cashier Dashboard...",
      "success"
    );

    await stopScanner();

    try {
      const cashierUrl = getCashierReturnUrl();

      cashierUrl.searchParams.set("token", token);

      // Same-tab return works without popup/postMessage dependency.
      window.location.replace(cashierUrl.toString());

    } catch (error) {
      scanProcessed = false;

      showMessage(
        error.message ||
        "Unable to return to Cashier Dashboard.",
        "error"
      );
    }
  }


  // Initial camera detection.
  window.addEventListener("load", loadCameras);

</script>

</body>
</html>
