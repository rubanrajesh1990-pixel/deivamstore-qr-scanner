<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deivam Store QR Scanner</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f2ed;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 550px;
      margin: 25px auto;
      background: white;
      padding: 22px;
      border-radius: 14px;
      box-shadow: 0 3px 12px #0002;
    }
    h2 { color: #603b22; }
    button, select {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      border: 0;
      background: #603b22;
      color: white;
      cursor: pointer;
    }
    button:disabled { opacity: .6; }
    select { border: 1px solid #ccc; background: white; }
    #reader { width: 100%; margin-top: 15px; }
    #result {
      margin-top: 18px;
      padding: 14px;
      background: #eee9e2;
      border-radius: 8px;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Deivam Store – QR Scanner</h2>

    <label for="cameraList">Select Camera</label>
    <select id="cameraList">
      <option value="">Detecting cameras...</option>
    </select>

    <button id="startButton" onclick="startScanner()">Start Scanner</button>
    <button id="stopButton" onclick="stopScanner()">Stop Scanner</button>

    <div id="reader"></div>
    <div id="result">Waiting for QR scan...</div>
  </div>

<script>
  let scanner = null;
  let running = false;
  let scanProcessed = false;

  const DEFAULT_CASHIER_URL =
    "https://script.google.com/macros/s/AKfycbwH0mmNSe55YfCEJoxWvTv3yMz-LsadTwi8jlTCmCzHJzI4ahWghcsUSI46Fm4B1_5I/exec?page=cashier";

  function getCashierUrl() {
    const params = new URLSearchParams(window.location.search);
    const suppliedReturnUrl = params.get("return");

    // Only allow the known Deivam Store Apps Script deployment.
    if (suppliedReturnUrl) {
      try {
        const parsed = new URL(suppliedReturnUrl);
        if (
          parsed.origin === "https://script.google.com" &&
          parsed.pathname.includes("/macros/s/") &&
          parsed.pathname.endsWith("/exec")
        ) {
          return parsed.origin + parsed.pathname + "?page=cashier";
        }
      } catch (e) {}
    }

    return DEFAULT_CASHIER_URL;
  }

  async function loadCameras() {
    try {
      const cameras = await Html5Qrcode.getCameras();
      const list = document.getElementById("cameraList");
      list.innerHTML = "";

      if (!cameras || !cameras.length) {
        list.innerHTML = '<option value="">No camera found</option>';
        return;
      }

      cameras.forEach((camera, index) => {
        const option = document.createElement("option");
        option.value = camera.id;
        option.textContent = camera.label || "Camera " + (index + 1);
        list.appendChild(option);
      });

      const mobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      if (mobile) {
        const back = cameras.find(c =>
          /back|rear|environment|wide/i.test(c.label)
        );
        if (back) list.value = back.id;
        else list.value = cameras[cameras.length - 1].id;
      }
    } catch (error) {
      document.getElementById("result").textContent =
        "Camera permission error: " + error.message +
        ". Open this page directly in Safari and allow Camera access.";
    }
  }

  async function startScanner() {
    if (running || scanProcessed) return;

    try {
      if (!scanner) scanner = new Html5Qrcode("reader");

      let selected = document.getElementById("cameraList").value;
      if (!selected) {
        await loadCameras();
        selected = document.getElementById("cameraList").value;
      }
      if (!selected) throw new Error("No camera selected.");

      document.getElementById("startButton").disabled = true;

      await scanner.start(
        selected,
        { fps: 10, qrbox: { width: 240, height: 240 } },
        onScanSuccess,
        () => {}
      );

      running = true;
      document.getElementById("result").textContent = "Scanner is running. Point the camera at the customer QR code.";
    } catch (error) {
      document.getElementById("startButton").disabled = false;
      document.getElementById("result").textContent =
        "Scanner error: " + error.message;
    }
  }

  async function onScanSuccess(text) {
    if (scanProcessed) return;
    scanProcessed = true;

    document.getElementById("result").textContent =
      "QR scanned successfully. Returning to Cashier Dashboard...";

    try {
      if (scanner && running) {
        await scanner.stop();
        running = false;
      }
    } catch (e) {
      running = false;
    }

    const token = String(text || "").trim();
    const validToken = /^[0-9a-f-]{36}-[0-9a-f-]{36}$/i.test(token);

    if (!validToken) {
      scanProcessed = false;
      document.getElementById("startButton").disabled = false;
      document.getElementById("result").textContent =
        "Invalid Deivam Store order QR token. Please scan the customer order QR again.";
      return;
    }

    // Android/desktop: use the existing opener message flow where available.
    if (window.opener && !window.opener.closed) {
      try {
        window.opener.postMessage({
          type: "DEIVAM_ORDER_TOKEN",
          token: token
        }, "https://script.google.com");

        document.getElementById("result").textContent =
          "QR sent to Cashier Dashboard. Returning...";
        setTimeout(() => window.close(), 700);
        return;
      } catch (e) {
        // Continue to the redirect fallback below.
      }
    }

    // iPhone Safari: opener is often unavailable. Return to cashier with token.
    const cashierUrl = getCashierUrl();
    window.location.replace(
      cashierUrl + "&token=" + encodeURIComponent(token)
    );
  }

  async function stopScanner() {
    if (scanner && running) {
      try {
        await scanner.stop();
      } finally {
        running = false;
      }
    }
    document.getElementById("startButton").disabled = false;
  }

  loadCameras();
</script>
</body>
</html>
