
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deivam Store - QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f5f7;
      color: #222;
      text-align: center;
    }

    .container {
      max-width: 480px;
      margin: 20px auto;
      padding: 22px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.10);
    }

    h2 {
      margin-top: 0;
      color: #222;
    }

    #reader {
      width: 100%;
      margin: 20px auto;
      overflow: hidden;
    }

    select, button {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border-radius: 8px;
      font-size: 16px;
    }

    select {
      border: 1px solid #ccc;
      background: white;
    }

    button {
      border: none;
      background: #1769aa;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button.stop {
      background: #d93636;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #result {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      background: #f1f1f1;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="container">

    <h2>Deivam Store</h2>
    <p>Scan Customer Order QR Code</p>

    <select id="cameraSelect">
      <option value="">Loading cameras...</option>
    </select>

    <div id="reader"></div>

    <button id="startButton" onclick="startScanner()">
      Start Scanner
    </button>

    <button id="stopButton" class="stop"
            onclick="stopScanner()" disabled>
      Stop Scanner
    </button>

    <div id="result">
      Initializing camera...
    </div>

  </div>

  <script>
    let scanner = null;
    let running = false;
    let scanProcessed = false;

    const cameraSelect =
      document.getElementById("cameraSelect");

    const startButton =
      document.getElementById("startButton");

    const stopButton =
      document.getElementById("stopButton");

    const result =
      document.getElementById("result");


    // Display messages
    function showMessage(message) {
      result.textContent = message;
    }


    // Validate the Cashier Dashboard return URL
    function getCashierReturnUrl() {
      const params = new URLSearchParams(
        window.location.search
      );

      const returnValue = params.get("return");

      if (!returnValue) {
        throw new Error(
          "Cashier Dashboard return URL not found."
        );
      }

      const cashierUrl = new URL(returnValue);

      const allowedHosts = [
        "script.google.com",
        "script.googleusercontent.com"
      ];

      if (
        cashierUrl.protocol !== "https:" ||
        !allowedHosts.includes(cashierUrl.hostname)
      ) {
        throw new Error(
          "Invalid Cashier Dashboard URL."
        );
      }

      return cashierUrl;
    }


    // Load available cameras
    async function loadCameras() {
      try {
        const cameras = await Html5Qrcode.getCameras();

        cameraSelect.innerHTML = "";

        if (!cameras || cameras.length === 0) {
          showMessage("No camera found on this device.");
          return;
        }

        cameras.forEach((camera, index) => {
          const option = document.createElement("option");

          option.value = camera.id;
          option.textContent =
            camera.label || "Camera " + (index + 1);

          cameraSelect.appendChild(option);
        });

        // Prefer rear camera on mobile devices
        const rearCamera = cameras.find(camera =>
          /back|rear|environment|world/i.test(camera.label)
        );

        if (rearCamera) {
          cameraSelect.value = rearCamera.id;
        } else {
          cameraSelect.value = cameras[0].id;
        }

        showMessage("Camera ready. Press Start Scanner.");

      } catch (error) {
        showMessage(
          "Unable to access cameras. Please allow camera permission."
        );
      }
    }


    // Start QR scanner
    async function startScanner() {
      if (running) return;

      const cameraId = cameraSelect.value;

      if (!cameraId) {
        showMessage("Please select a camera.");
        return;
      }

      scanProcessed = false;

      try {
        scanner = new Html5Qrcode("reader");

        await scanner.start(
          cameraId,
          {
            fps: 10,
            qrbox: function(viewfinderWidth, viewfinderHeight) {
              const size = Math.min(
                viewfinderWidth,
                viewfinderHeight,
                250
              );

              return {
                width: size,
                height: size
              };
            }
          },
          onScanSuccess,
          function() {
            // Ignore unsuccessful frame scans
          }
        );

        running = true;

        startButton.disabled = true;
        stopButton.disabled = false;
        cameraSelect.disabled = true;

        showMessage("Scanner active. Point camera at the order QR.");

      } catch (error) {
        running = false;

        startButton.disabled = false;
        stopButton.disabled = true;
        cameraSelect.disabled = false;

        showMessage(
          "Unable to start camera: " +
          (error.message || error)
        );
      }
    }


    // Stop QR scanner
    async function stopScanner() {
      try {
        if (scanner && running) {
          await scanner.stop();
        }
      } catch (error) {
        console.log("Scanner stop:", error);
      }

      running = false;

      startButton.disabled = false;
      stopButton.disabled = true;
      cameraSelect.disabled = false;
    }


    // QR scan success
    async function onScanSuccess(text) {

      if (scanProcessed) return;

      scanProcessed = true;

      const token = String(text || "").trim();

      // Validate order token
      const validToken =
        /^[0-9a-f-]{36}-[0-9a-f-]{36}$/i.test(token);

      if (!validToken) {
        scanProcessed = false;

        showMessage(
          "Invalid Deivam Store order QR token. Please scan again."
        );

        return;
      }

      showMessage(
        "QR scanned successfully. Returning to Cashier Dashboard..."
      );

      await stopScanner();

      try {

        // Read the return URL passed by Cashier Dashboard
        const cashierUrl = getCashierReturnUrl();

        // Attach scanned order token
        cashierUrl.searchParams.set("token", token);

        // Return to Cashier Dashboard
        window.location.replace(
          cashierUrl.toString()
        );

      } catch (error) {

        scanProcessed = false;

        showMessage(
          error.message ||
          "Unable to return to Cashier Dashboard."
        );
      }
    }


    // Initialize
    window.addEventListener("load", loadCameras);

  </script>

</body>
</html>
