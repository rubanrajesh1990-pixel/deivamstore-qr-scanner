
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deivam Store QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      background: #f5f3ef;
      color: #29251f;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    header {
      background: #633b20;
      color: white;
      text-align: center;
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 18px;
    }

    .panel {
      background: white;
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px #00000012;
    }

    select, button {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border-radius: 8px;
      font-size: 16px;
    }

    select {
      border: 1px solid #ccc;
      background: white;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    button:disabled { opacity: 0.5; }

    .primary {
      background: #633b20;
      color: white;
    }

    .secondary {
      background: #eee5da;
      color: #352719;
    }

    #reader {
      width: 100%;
      overflow: hidden;
    }

    #message {
      line-height: 1.5;
      font-size: 14px;
    }

    .error { color: #b00020; }
    .success { color: #16834a; }
  </style>
</head>

<body>
<div class="container">

  <header>
    <h2>DEIVAM STORE</h2>
    <div>Order QR Scanner</div>
  </header>

  <div class="panel">
    <h3>Camera Selection</h3>

    <select id="cameraSelect">
      <option value="">Auto Detect Camera</option>
    </select>

    <button
      id="startButton"
      class="primary"
      onclick="startScanner()"
    >
      Start Scanner
    </button>

    <button
      id="stopButton"
      class="secondary"
      onclick="stopScanner()"
      disabled
    >
      Stop Scanner
    </button>
  </div>

  <div class="panel">
    <div id="reader"></div>
  </div>

  <div class="panel">
    <div id="message">
      Press Start Scanner to activate your camera.
    </div>
  </div>

</div>

<script>
  let scanner = null;
  let scannerRunning = false;
  let scanProcessed = false;
  let startingScanner = false;

  const TOKEN_REGEX =
    /^[0-9a-f-]{36}-[0-9a-f-]{36}$/i;


  function showMessage(text, type = "") {
    const element = document.getElementById("message");
    element.textContent = text;
    element.className = type;
  }


  // Validate Cashier Dashboard return URL.
  function getCashierReturnUrl() {
    const params = new URLSearchParams(window.location.search);
    const returnValue = params.get("return");

    if (!returnValue) {
      throw new Error(
        "Cashier Dashboard return URL not found."
      );
    }

    const cashierUrl = new URL(returnValue);

    const allowedHosts = [
      "script.google.com",
      "script.googleusercontent.com"
    ];

    if (
      cashierUrl.protocol !== "https:" ||
      !allowedHosts.includes(cashierUrl.hostname)
    ) {
      throw new Error("Invalid Cashier Dashboard URL.");
    }

    return cashierUrl;
  }


  // Start camera only after the user presses Start Scanner.
  async function startScanner() {
    if (scannerRunning || startingScanner) return;

    startingScanner = true;
    scanProcessed = false;

    const startButton =
      document.getElementById("startButton");

    const stopButton =
      document.getElementById("stopButton");

    const select =
      document.getElementById("cameraSelect");

    startButton.disabled = true;

    showMessage("Initializing camera...");

    const isMobile =
      /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

    const config = {
      fps: 10,
      qrbox: { width: 240, height: 240 }
    };

    scanner = new Html5Qrcode("reader");

    try {
      // Mobile: First try the rear camera.
      if (isMobile && !select.value) {
        try {
          await scanner.start(
            { facingMode: "environment" },
            config,
            onScanSuccess,
            () => {}
          );

          scannerRunning = true;
          stopButton.disabled = false;

          showMessage(
            "Rear camera started. Scan the customer QR.",
            "success"
          );

          startingScanner = false;
          return;

        } catch (mobileError) {
          // Fall back to available camera.
        }
      }

      // Detect cameras after the user interaction.
      const cameras = await Html5Qrcode.getCameras();

      if (!cameras || cameras.length === 0) {
        throw new Error("No camera detected.");
      }

      // Populate camera selection.
      const previousSelection = select.value;

      select.innerHTML = "";

      cameras.forEach((camera, index) => {
        const option = document.createElement("option");
        option.value = camera.id;
        option.textContent =
          camera.label || ("Camera " + (index + 1));

        select.appendChild(option);
      });

      // Respect manually selected camera if available.
      let selectedCamera = cameras.find(
        camera => camera.id === previousSelection
      );

      if (!selectedCamera) {
        selectedCamera = isMobile
          ? cameras.find(camera =>
              /back|rear|environment|world/i.test(camera.label)
            ) || cameras[0]
          : cameras.find(camera =>
              /asus/i.test(camera.label)
            ) || cameras[0];
      }

      select.value = selectedCamera.id;

      await scanner.start(
        selectedCamera.id,
        config,
        onScanSuccess,
        () => {}
      );

      scannerRunning = true;
      stopButton.disabled = false;
      select.disabled = true;

      showMessage(
        "Scanner started. Point the camera at the customer QR.",
        "success"
      );

    } catch (error) {
      scanner = null;
      scannerRunning = false;

      startButton.disabled = false;
      stopButton.disabled = true;
      select.disabled = false;

      showMessage(
        "Camera start error: " + error.message,
        "error"
      );

    } finally {
      startingScanner = false;
    }
  }


  // Stop scanner safely.
  async function stopScanner() {
    if (!scanner || !scannerRunning) return;

    try {
      await scanner.stop();
      await scanner.clear();
    } catch (error) {
      // Ignore camera cleanup errors.
    }

    scannerRunning = false;
    scanner = null;

    document.getElementById("startButton").disabled = false;
    document.getElementById("stopButton").disabled = true;
    document.getElementById("cameraSelect").disabled = false;

    showMessage(
      "Scanner stopped. Press Start Scanner to scan again."
    );
  }


  // QR scan success.
  async function onScanSuccess(decodedText) {
    if (scanProcessed) return;

    scanProcessed = true;

    const token = String(decodedText || "").trim();

    if (!TOKEN_REGEX.test(token)) {
      scanProcessed = false;

      showMessage(
        "Invalid Deivam Store order QR token. Please scan again.",
        "error"
      );

      return;
    }

    showMessage(
      "QR scanned successfully. Returning to Cashier Dashboard...",
      "success"
    );

    try {
      if (scanner && scannerRunning) {
        await scanner.stop();
        await scanner.clear();
        scannerRunning = false;
        scanner = null;
      }

      const cashierUrl = getCashierReturnUrl();

      cashierUrl.searchParams.set("token", token);

      // Return to Cashier Dashboard with scanned token.
      window.location.replace(cashierUrl.toString());

    } catch (error) {
      scanProcessed = false;

      showMessage(
        error.message ||
        "Unable to return to Cashier Dashboard.",
        "error"
      );

      document.getElementById("startButton").disabled = false;
    }
  }

</script>
</body>
</html>
